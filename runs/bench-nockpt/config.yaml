run_name: bench-nockpt
model: Qwen/Qwen3-4B-Instruct-2507
dataset_dir: data/processed/cuad_v1
valid_subset: 8
seed: 42
fine_tune_type: lora
num_layers: -1
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
  keys:
  - self_attn.q_proj
  - self_attn.k_proj
  - self_attn.v_proj
  - self_attn.o_proj
  - mlp.gate_proj
  - mlp.up_proj
  - mlp.down_proj
optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01
learning_rate: 0.0001
lr_schedule:
  name: cosine_decay
  warmup: 38
  warmup_init: 1.0e-06
  arguments:
  - 0.0001
  - 712
  - 1.0e-05
batch_size: 2
grad_accumulation_steps: 4
iters: 15
max_seq_length: 5632
mask_prompt: true
grad_checkpoint: false
steps_per_report: 5
steps_per_eval: 1000
save_every: 1000
val_batches: -1
